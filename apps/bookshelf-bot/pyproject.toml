[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookshelf_bot"]

[project]
name = "bookshelf-bot"
version = "0.1.0"
description = "Telegram bot: bookshelf-bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "python-telegram-bot>=21.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27",
  "telegram-bot-shared",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv.sources]
telegram-bot-shared = { path = "../../libs/telegram-bot-shared", editable = true }

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
