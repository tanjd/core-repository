[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["index_watch*"]

[project]
name = "index-watch"
version = "1.3.0"
description = "Telegram bot for index-watch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "yfinance>=0.2.50",
    "fear-and-greed>=0.4",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[dependency-groups]
dev = ["basedpyright>=1.35", "pre-commit>=4.0", "pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Basedpyright config (replaces pyright for better compatibility)
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# Suppress warnings for external library type stubs and mocks
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingParameterType = false
reportPrivateUsage = false
