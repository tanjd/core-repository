# Copy to docker-compose.yml (gitignored — see root .gitignore) wherever
# you're running the stack (e.g. your NAS), put a .env file next to it
# (see .env.compose.example — full guide in apps/bookshelf/README.md), then:
#
#   docker compose pull && docker compose up -d
#
# Only the frontend's port is published. The backend is reachable solely
# via the compose-internal network at http://bookshelf-backend:8000 —
# apps/bookshelf's src/app/api/[...path]/route.ts proxies every API call
# server-side, so browsers never talk to the backend directly and it
# doesn't need to be exposed.

services:
  bookshelf-backend:
    image: ghcr.io/tanjd/bookshelf-backend:latest
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      PORT: "8000"
      DB_PATH: /app/data/bookshelf.db
      JWT_SECRET: ${JWT_SECRET:?set a long random string in .env — see .env.compose.example}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set a long random string in .env — see .env.compose.example}
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@bookshelf.local}
      DEV_EMAIL_OVERRIDE: ${DEV_EMAIL_OVERRIDE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INTERNAL_SECRET: ${TELEGRAM_INTERNAL_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_HEALTH_URL: ${TELEGRAM_BOT_HEALTH_URL:-http://bookshelf-bot:8080/health}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - bookshelf-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  bookshelf:
    image: ghcr.io/tanjd/bookshelf:latest
    restart: unless-stopped
    depends_on:
      bookshelf-backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://bookshelf-backend:8000
    ports:
      - "3000:3000"

  # Optional — only needed if you want Telegram push notifications (see
  # apps/bookshelf/docs/telegram-bot-integration-spec.md). Leave
  # TELEGRAM_BOT_TOKEN unset above and remove this service if you don't.
  bookshelf-bot:
    image: ghcr.io/tanjd/bookshelf-bot:latest
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_TOKEN_DEV: ${TELEGRAM_BOT_TOKEN:-}
      BOOKSHELF_BACKEND_URL: http://bookshelf-backend:8000
      BOOKSHELF_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_SECRET:-}
    depends_on:
      bookshelf-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bookshelf-data:
