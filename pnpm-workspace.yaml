packages:
  - "apps/*"
  - "libs/*"

# Nx is intentionally capped below 23.0.0 (see root CLAUDE.md's "Known gaps") because
# @nx-go/nx-go has no version supporting Nx 23+ - `pnpm update -r --latest` (make upgrade-pnpm)
# would otherwise blow straight past that cap since --latest ignores package.json's version
# specifiers entirely. Nx upgrades must go through `make upgrade-nx` (nx migrate), which pins to
# a specific version after checking @nx-go/nx-go's @nx/devkit peer range.
updateConfig:
  ignoreDependencies:
    - "nx"
    - "@nx/*"
    - "@nx-go/*"
    # typescript 7.x breaks Nx 22.7.8's project graph (readConfigFile no longer exists the
    # way nx/@typescript-eslint expect) - cap at the last working 6.x release until Nx catches
    # up. @vitejs/plugin-react 6.x imports a "vite/internal" runtime subpath that vite 7.x/8.x
    # no longer exports, breaking apps/jeddy-tan's project graph - cap at the last working 5.x
    # release until that's fixed upstream. Found via `make verify` after a `make upgrade-pnpm` run.
    - "typescript"
    - "@vitejs/plugin-react"

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  less: false
  msw: false
  nx: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@next/eslint-plugin-next@16.3.3"
  - eslint-config-next@16.3.3

overrides:
  # No fixed version published for GHSA-vwc7-r8mq-g2x9 (symlink-following extraction) yet —
  # bump this pin once one ships.
  adm-zip: 0.6.0
  # GHSA-rgw5-rvv9-x895 (DoS via unbounded intermediate arrays), pulled in transitively via the
  # pinned Nx 22.7.8 toolchain (minimatch). Only the v5 line is affected (v2 instance is fine).
  brace-expansion@5: 5.0.9
  esbuild: 0.25.0
  fast-uri: 3.1.6
  file-type: 21.3.4
  hono: 4.13.5
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  koa: 3.1.2
  minimatch: 9.0.9
  qs: 6.16.0
  # jsdom's own selector-engine dependency. 2.2.26+ has an open upstream
  # regression where matching `:modal` recurses into repeated
  # Element.matches() calls under jsdom (~1.3s each) — Radix UI's
  # Popover/Dialog primitives check `:modal` internally, so opening one in a
  # jsdom-based test (e.g. RecommendedBy.test.tsx) blows past Jest's default
  # test timeout. See dperini/nwsapi#171, #172, #177 (all open as of
  # 2026-09-03). Pinned to 2.2.25, the last version before the regression —
  # drop this once upstream ships a fix.
  nwsapi: 2.2.25
  picomatch: 4.0.5
  postcss: 8.5.25
  serialize-javascript: 7.0.7
  sharp: 0.35.4
  smol-toml: 1.7.1
  svgo@4: 4.1.0
  undici: 7.29.0
  uuid: 11.1.1
  vite: 6.4.3
  vitest: 4.1.11
  ws: 8.21.1
