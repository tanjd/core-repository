# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: README.md|.*\.iml$
      - id: end-of-file-fixer
        exclude: tsconfig.*\.json$
      - id: check-yaml
        args:
          - --unsafe
      - id: check-added-large-files
        # apps/jeddy-tan/assets-src/jeddy.png is the uncropped source avatar
        # the site's favicon/logo set is generated from (see
        # apps/jeddy-tan/CLAUDE.md) — a one-off ~700KB asset, not something
        # that will recur or grow, so it's not worth raising the limit
        # repo-wide for.
        exclude: ^apps/jeddy-tan/assets-src/jeddy\.png$
      - id: pretty-format-json
        args:
          - --autofix
        exclude: (devcontainer.*|package-lock|tsconfig.*)\.json$
      - id: check-merge-conflict
      - id: debug-statements
        # ledger-lens-backend requires Python >=3.14 (matches its production
        # image); this hook's own venv parses with an older Python and can't
        # yet handle PEP 758 unparenthesized except-tuples, which ruff's
        # formatter produces under a py314 target-version. Unrelated to what
        # this hook actually checks for (stray pdb/breakpoint calls).
        exclude: ^apps/ledger-lens-backend/
      - id: mixed-line-ending
        args: ["--fix=no"]
