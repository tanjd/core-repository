name: Publish

on:
  # release.yml creates the GitHub Release using a PAT (GHA_TRIGGER_TOKEN),
  # not the default GITHUB_TOKEN, specifically so this event fires normally
  # (GitHub's anti-recursion rule blocks the default token from triggering
  # other workflows). workflow_dispatch additionally supports retrying a
  # publish without re-cutting the release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. food-maps-backend@0.2.0"
        required: true

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker-push:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Resolve project from release tag
        id: resolve
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          project="${tag%@*}"
          if [ -z "$project" ] || [ "$project" = "$tag" ]; then
            echo "::error::Could not parse a project name out of release tag '$tag' (expected '<project>@<version>')"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Resolve commit SHA for the release tag
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read pnpm version from devcontainer config
        id: pnpm-version
        run: |
          version=$(jq -r '.features["ghcr.io/devcontainers/features/node:1"].pnpmVersion' .devcontainer/devcontainer.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions cache variables
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push docker image for ${{ steps.resolve.outputs.project }}
        run: npx nx run ${{ steps.resolve.outputs.project }}:docker-push
        env:
          GITHUB_SHA: ${{ steps.resolve-sha.outputs.sha }}
