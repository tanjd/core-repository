name: Detect dockerized apps

on:
  workflow_call:
    outputs:
      apps:
        description: JSON array of affected app names that own a Dockerfile
        value: ${{ jobs.detect.outputs.apps }}

jobs:
  detect:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pnpm version from devcontainer config
        id: pnpm-version
        run: |
          version=$(jq -r '.features["ghcr.io/devcontainers/features/node:1"].pnpmVersion' .devcontainer/devcontainer.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v5

      - name: Detect affected apps with a Dockerfile
        id: detect
        run: |
          affected=$(npx nx show projects --affected --type app \
            --base="${{ steps.set-shas.outputs.base }}" \
            --head="${{ steps.set-shas.outputs.head }}" --json)

          dockerized="[]"
          for app in $(echo "$affected" | jq -r '.[]'); do
            if [ -f "apps/$app/Dockerfile" ]; then
              dockerized=$(echo "$dockerized" | jq -c --arg app "$app" '. + [$app]')
            fi
          done

          echo "apps=$dockerized" >> "$GITHUB_OUTPUT"
          echo "Affected apps: $affected"
          echo "Dockerized: $dockerized"
