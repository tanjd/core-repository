name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  main:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Nx computation cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v5

      - name: Run pre-commit and nx targets
        uses: devcontainers/ci@v0.3
        env:
          IMAGE: ghcr.io/tanjd/core-repository
          cacheFrom: ghcr.io/tanjd/core-repository
          NX_BASE: ${{ steps.set-shas.outputs.base }}
          NX_HEAD: ${{ steps.set-shas.outputs.head }}
        with:
          imageName: ${{ env.IMAGE }}
          cacheFrom: ${{ env.IMAGE }}
          push: always
          runCmd: |
            pnpm install --frozen-lockfile
            pnpm format
            pre-commit run --all-files
            npx nx affected --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }} -t lint test --verbose

  detect-dockerized:
    uses: ./.github/workflows/detect-dockerized-apps.yml

  docker-build-check:
    needs: detect-dockerized
    if: needs.detect-dockerized.outputs.apps != '[]'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-dockerized.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.app }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
