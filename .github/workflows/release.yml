name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v4

      - name: Detect affected deployable apps
        id: detect
        run: |
          affected=$(npx nx show projects --affected --type app \
            --base="${{ steps.set-shas.outputs.base }}" \
            --head="${{ steps.set-shas.outputs.head }}" --json)

          # A project is "deployable" if it owns a Dockerfile.
          deployable="[]"
          for app in $(echo "$affected" | jq -r '.[]'); do
            if [ -f "apps/$app/Dockerfile" ]; then
              deployable=$(echo "$deployable" | jq -c --arg app "$app" '. + [$app]')
            fi
          done

          echo "apps=$deployable" >> "$GITHUB_OUTPUT"
          echo "Affected apps: $affected"
          echo "Deployable (have a Dockerfile): $deployable"

  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/tanjd/${{ matrix.app }}:latest
            ghcr.io/tanjd/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
