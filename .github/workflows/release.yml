name: Release

# Temporarily disabled: no longer triggers on push to main. Re-enable by
# restoring the `push` trigger below once release is ready to resume.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker-push:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pnpm version from devcontainer config
        id: pnpm-version
        run: |
          version=$(jq -r '.features["ghcr.io/devcontainers/features/node:1"].pnpmVersion' .devcontainer/devcontainer.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v5

      - name: Push affected docker images
        run: npx nx affected -t docker-push --base=${{ steps.set-shas.outputs.base }} --head=${{ steps.set-shas.outputs.head }}
