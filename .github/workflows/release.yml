name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # Gate on CI passing: workflow_run fires on every CI completion (success
    # or failure), so we still need to check conclusion ourselves. Manual
    # workflow_dispatch runs bypass this - there's no workflow_run event to
    # check in that case.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Check out the branch (not a raw SHA) so this has a real local
          # branch with upstream tracking - `nx release` pushes via a bare
          # `git push` with no explicit refspec, which fails with "not
          # currently on a branch" in detached HEAD.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          token: ${{ secrets.GHA_TRIGGER_TOKEN }}

      - name: Pin to the commit CI actually ran on
        # workflow_run always checks out the default branch by default;
        # reset to the exact commit CI tested rather than whatever the
        # branch tip happens to be by the time this job runs. Stays on the
        # checked-out branch (unlike checking out the SHA directly), so the
        # branch keeps its upstream tracking. Skipped for workflow_dispatch,
        # where there's no workflow_run event/SHA to pin to.
        if: ${{ github.event.workflow_run.head_sha != '' }}
        run: git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Read pnpm version from devcontainer config
        id: pnpm-version
        run: |
          version=$(jq -r '.features["ghcr.io/devcontainers/features/node:2"].pnpmVersion' .devcontainer/devcontainer.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure git identity for release commits
        # Commits as tanjd's own account, not github-actions[bot]: GitHub can
        # only verify a commit signature against a signing key registered on
        # a real account, and a bot identity has no such account settings to
        # register one against. Same identity index-watch/table-talks commit
        # release changes as, for the same reason.
        run: |
          git config user.name "tanjd"
          git config user.email "42729752+tanjd@users.noreply.github.com"

      - name: Configure SSH commit signing
        # Mirrors index-watch/table-talks's python-semantic-release
        # ssh_private_signing_key input, hand-rolled since nx release has no
        # equivalent option. user.signingkey points at the private key file;
        # git derives the public half itself when signing (no ssh-agent
        # needed for an unencrypted automation key). Verification itself is
        # server-side against the public key already registered on tanjd's
        # GitHub account - nothing else here needs to change.
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.SSH_PRIVATE_SIGNING_KEY }}" > ~/.ssh/release_signing_key
          chmod 600 ~/.ssh/release_signing_key
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/release_signing_key
          git config commit.gpgsign true

      - name: Version affected projects and tag releases
        # Uses GHA_TRIGGER_TOKEN (a fine-grained PAT), not the default
        # GITHUB_TOKEN: GitHub's anti-recursion rule means a push/release
        # created via the default GITHUB_TOKEN does not itself fire a
        # `release: published` event for publish.yml to react to. A PAT
        # acts like a real user, so the release this creates triggers
        # publish.yml normally - no explicit bridging step needed.
        # Retries on failure: nx release computes versions from git history
        # then does a plain `git push` (no rebase/force) at the end, so if
        # main moved between this job's checkout and that push - another
        # release run, or a direct push - it fails non-fast-forward. Resync
        # to origin/main and recompute rather than leaving a whole release
        # cycle stuck on a transient race. Local tags must be cleared before
        # retrying: nx release creates them locally before the failed push,
        # and would collide with itself recreating the same tag names.
        run: |
          for attempt in 1 2 3; do
            if npx nx release --skip-publish; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "nx release failed after $attempt attempts" >&2
              exit 1
            fi

            echo "nx release failed (attempt $attempt/3) - resyncing with origin/main and retrying" >&2
            git tag -d $(git tag -l) 2>/dev/null || true
            git fetch origin main --tags --force
            git reset --hard origin/main
            sleep $((attempt * 5))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GHA_TRIGGER_TOKEN }}
          # nx release performs its own `git commit` internally for the
          # version bump; that would otherwise trigger .husky/pre-commit,
          # whose pre-commit/nx-affected layers assume a full devcontainer
          # (Python pre-commit, Go, uv) that this bare runner doesn't have.
          # The commit here only contains content nx release itself just
          # generated (manifests, changelog, lockfile) - already gated by
          # ci.yml on the merged PR - so skipping hooks for it is safe.
          HUSKY: "0"
