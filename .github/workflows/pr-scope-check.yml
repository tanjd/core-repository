name: PR Scope Check

# nx release's conventionalCommits.useCommitScope (default true, unmodified in
# this repo's nx.json) matches a commit's `(scope)` against project names to
# decide the semver bump per project: a release project whose files a commit
# touches but which ISN'T named in the scope only gets an indirect PATCH
# bump, never the real feat/fix-implied one - even though it's still listed
# in that project's changelog under the right heading, which makes the
# under-bump easy to miss. bookshelf-backend has landed real features as
# patch bumps this way more than once (PR #43, #47) because a PR that
# touched both apps/bookshelf and apps/bookshelf-backend was titled
# `feat(bookshelf): ...` instead of `feat(bookshelf,bookshelf-backend): ...`.
#
# A PR title with NO scope at all is fine and not flagged here - nx treats an
# unscoped commit as scoped to every project it touches, so every affected
# release project gets the full bump. Only a title that DOES specify a scope,
# but omits a release project the diff actually touches, is the failure mode
# this catches.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pnpm version from devcontainer config
        id: pnpm-version
        run: |
          version=$(jq -r '.features["ghcr.io/devcontainers/features/node:1"].pnpmVersion' .devcontainer/devcontainer.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v5

      - name: Check PR title scope covers every affected release project
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          NX_BASE: ${{ steps.set-shas.outputs.base }}
          NX_HEAD: ${{ steps.set-shas.outputs.head }}
        run: |
          # No scope in the title at all -> nx treats the commit as scoped to
          # every project it touches, so there's nothing to check.
          scope=$(printf '%s' "$PR_TITLE" | sed -nE 's/^[A-Za-z]+\(([^)]+)\)!?:.*/\1/p')
          if [ -z "$scope" ]; then
            echo "No scope in PR title - nx will apply the full bump to every touched project. Nothing to check."
            exit 0
          fi

          affected=$(npx nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --json)
          release_projects=$(jq -r '.release.projects[]' nx.json)

          missing=""
          for project in $release_projects; do
            if echo "$affected" | jq -e --arg p "$project" 'index($p) != null' > /dev/null; then
              if ! printf '%s' "$scope" | tr ',' '\n' | sed -E 's/^\s+|\s+$//g' | grep -qx "$project"; then
                missing="$missing $project"
              fi
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::PR title scope \"$scope\" doesn't cover every release project this diff touches:$missing"
            echo "This PR's diff touches$missing but the title only scopes \"$scope\"."
            echo "nx release's useCommitScope treats a scoped commit as only INDIRECTLY affecting a"
            echo "project not named in its scope, capping it at a patch bump even for a feat/fix - e.g."
            echo "\"feat(bookshelf): ...\" that also touches bookshelf-backend gives bookshelf-backend a"
            echo "patch bump instead of the minor bump a feat implies."
            echo "Fix: widen the title's scope to include every touched project, e.g."
            echo "  feat($(echo "$scope$missing" | tr ' ' ',' | sed -E 's/^,+//; s/,+/,/g')): ..."
            echo "or drop the scope entirely if the change isn't meaningfully scoped to one project."
            exit 1
          fi

          echo "PR title scope \"$scope\" covers every affected release project."
