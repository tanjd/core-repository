services:
  bookshelf-backend:
    user: "568:568"
    image: ghcr.io/tanjd/bookshelf-backend:latest
    container_name: bookshelf-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /mnt/apps/bookshelf:/app/data
    environment:
      - ENV=${ENV}
      - PORT=${PORT:-8000}
      - DB_PATH=${DB_PATH}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=https://${DOMAIN}
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - EMAIL_FROM=${EMAIL_FROM:-noreply@yourdomain.com}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - METADATA_REFRESH_INTERVAL=${METADATA_REFRESH_INTERVAL:-}
    networks:
      - bookshelf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bookshelf-frontend:
    image: ghcr.io/tanjd/bookshelf:latest
    container_name: bookshelf-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The Next.js server (inside Docker) proxies /api/* to this URL.
      # Uses the Docker Compose service name — no changes needed here.
      - BACKEND_URL=${BACKEND_URL}
    networks:
      - proxy
      - bookshelf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookshelf.rule=Host(`bookshelf.tanjd.com`)"
      - "traefik.http.routers.bookshelf.entrypoints=websecure"
      - "traefik.http.routers.bookshelf.tls.certresolver=cloudflare"
      - "traefik.http.services.bookshelf.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    depends_on:
      bookshelf-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bookshelf:
    driver: bridge
    enable_ipv6: false
  proxy:
    external: true
